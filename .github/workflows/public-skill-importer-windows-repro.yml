name: Public skill importer Windows path repro

on:
  push:
    branches:
      - security/poc-public-skill-importer-windows-path

jobs:
  windows-path-repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Jan production importer test in headless configuration
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --lib public_skill_importer_writes_backslash_traversal_outside_destination -- --nocapture
