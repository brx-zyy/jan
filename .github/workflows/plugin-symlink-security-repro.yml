name: Plugin Skill Symlink Security Reproduction

on:
  push:
    branches:
      - security/poc-plugin-skill-symlink-e2e

permissions:
  contents: read

jobs:
  reproduce:
    name: Jan skill discovery and read end-to-end
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out test branch
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Run the focused Jan security reproduction
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --lib \
            symlinked_plugin_skill_can_read_outside_plugin_after_git_clone \
            -- --nocapture --test-threads=1 2>&1 | tee plugin-symlink-e2e.log

      - name: Upload reproduction log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: plugin-symlink-e2e-log
          path: plugin-symlink-e2e.log
          if-no-files-found: warn
